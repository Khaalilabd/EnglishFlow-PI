# SonarQube Exclusions for EnglishFlow Project

# Exclude test files from main analysis
sonar.exclusions=**/*Test.java,**/*Tests.java,**/test/**

# Exclude generated and configuration files
sonar.exclusions=**/target/**,**/dto/**,**/entity/**,**/config/**,**/mapper/**

# Exclude common duplicated patterns
sonar.exclusions=**/DatabaseInitializer.java,**/GlobalExceptionHandler.java

# Exclude application main classes
sonar.exclusions=**/*Application.java,**/*ServiceApplication.java

# Exclude utility and helper classes
sonar.exclusions=**/util/**,**/helper/**,**/constant/**

# Exclude client and external integration classes
sonar.exclusions=**/client/**,**/integration/**

# Exclude scheduler and background job classes
sonar.exclusions=**/scheduler/**,**/job/**

# Exclude exception classes (mostly boilerplate)
sonar.exclusions=**/exception/**