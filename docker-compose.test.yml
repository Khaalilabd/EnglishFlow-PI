version: '3.8'

name: jungle-in-english-test

services:
  # PostgreSQL for tests
  postgres-test:
    image: postgres:15-alpine
    container_name: englishflow-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  # Redis for tests
  redis-test:
    image: redis:7-alpine
    container_name: englishflow-redis-test
    ports:
      - "6380:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Run backend tests
  backend-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: englishflow-backend-tests
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network
    environment:
      - DB_URL=jdbc:postgresql://postgres-test:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=test
      - EUREKA_CLIENT_ENABLED=false
      - SPRING_CLOUD_CONFIG_ENABLED=false
    volumes:
      - ./backend:/app/backend
      - maven-cache:/root/.m2
    command: >
      sh -c "
        echo '🧪 Running Backend Tests...' &&
        cd /app/backend &&
        for service in auth-service courses-service community-service messaging-service club-service event-service learning-service complaints-service gamification-service exam-service payment-service sponsors-service; do
          if [ -d \$service ]; then
            echo '📦 Testing \$service...' &&
            cd \$service &&
            mvn clean test -B || exit 1 &&
            cd .. ;
          fi
        done &&
        echo '✅ All tests passed!'
      "

networks:
  test-network:
    driver: bridge

volumes:
  maven-cache:
    driver: local
