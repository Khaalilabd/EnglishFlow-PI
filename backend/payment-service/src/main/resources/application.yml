server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:your-secret-key}

paymee:
  api-key: ${PAYMEE_API_KEY:4e9385e30b65c688d6d28de68156c4870e350887}
  base-url: ${PAYMEE_BASE_URL:https://sandbox.paymee.tn}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  backend-url: ${BACKEND_URL:http://localhost:8095}
  courses-service-url: ${COURSES_SERVICE_URL:http://localhost:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
