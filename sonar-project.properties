# SonarCloud Configuration for EnglishFlow
# Project identification
sonar.projectKey=Khaalilabd_Esprit-PIDEV-4SAE1-2026-JungleInEnglish
sonar.organization=khaalilabd
sonar.projectName=EnglishFlow - Jungle in English
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=backend
sonar.tests=backend

# Exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.java,**/frontend/**

# Test inclusions
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Language-specific settings
sonar.java.source=17
sonar.java.binaries=**/target/classes

# Code quality thresholds - Adjusted for development project
sonar.qualitygate.wait=false

# Duplications - More lenient for development
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/config/**,**/mapper/**,**/exception/**,**/controller/**,**/DatabaseInitializer.java,**/GlobalExceptionHandler.java

# Additional exclusions for generated code and common patterns
sonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/**,**/AuthServiceApplication.java,**/repository/**,**/client/**,**/enums/**,**/mapper/**,**/exception/**,**/scheduler/**,**/util/**

# Security hotspots exclusions for common Spring Boot patterns
sonar.security.exclusions=**/config/**,**/dto/**,**/entity/**,**/test/**

# Issue exclusions for development project
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1313
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S4502
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S5122
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e5.ruleKey=common-java:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.java

# Duplication threshold - More realistic for microservices
sonar.cpd.java.minimumtokens=100

# Quality gate conditions - More lenient
sonar.qualitygate.conditions.new_coverage=50
sonar.qualitygate.conditions.new_duplicated_lines_density=10
sonar.qualitygate.conditions.new_reliability_rating=C
sonar.qualitygate.conditions.new_security_rating=C
sonar.qualitygate.conditions.new_maintainability_rating=C
