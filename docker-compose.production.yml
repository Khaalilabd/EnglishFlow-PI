version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_MULTIPLE_DATABASES: englishflow_identity,englishflow_community,englishflow_learning_db,englishflow_messaging_db,englishflow_jungle_club_db,englishflow_courses,englishflow_exams,englishflow_event_db,englishflow_complaints,englishflow_gamification
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - englishflow
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    networks:
      - englishflow
    restart: unless-stopped

  # Eureka Server
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - englishflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_identity
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      REDIS_HOST: redis
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - postgres
      - eureka-server
      - redis
    networks:
      - englishflow
    restart: unless-stopped

  # Community Service
  community-service:
    build:
      context: ./backend/community-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_community
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Learning Service
  learning-service:
    build:
      context: ./backend/learning-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_learning_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Messaging Service
  messaging-service:
    build:
      context: ./backend/messaging-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_messaging_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Club Service
  club-service:
    build:
      context: ./backend/club-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_jungle_club_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Courses Service
  courses-service:
    build:
      context: ./backend/courses-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_courses
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Exam Service
  exam-service:
    build:
      context: ./backend/exam-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_exams
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Event Service
  event-service:
    build:
      context: ./backend/event-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_event_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Complaints Service
  complaints-service:
    build:
      context: ./backend/complaints-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_complaints
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Gamification Service
  gamification-service:
    build:
      context: ./backend/gamification-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/englishflow_gamification
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    networks:
      - englishflow
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - englishflow
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  englishflow:
    driver: bridge
